
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rainbow Catering Club</title>

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!--Maked using ChatGPT copy the style of the image which is rainbow catering-->>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #c4e8ed;
            font-family: "Trebuchet MS", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background decorations */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #a5d3dc;
            opacity: 0.65;
            z-index: -1;
        }

        body::before {
            top: -45px;
            left: -35px;
        }

        body::after {
            bottom: -50px;
            right: -30px;
        }

        .main-card {
            background-color: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(40, 70, 90, 0.12);
            border: 5px solid #f8e5aa;
        }

        .school-name {
            color: #263b59;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .department {
            color: #263b59;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .club-title {
            color: #d94769;
            font-size: clamp(32px, 7vw, 48px);
            font-weight: 1000;
            line-height: 1.05;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #5795e5;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .divider {
            border: none;
            border-top: 4px dotted #263b59;
            margin: 22px 0;
            opacity: 1;
        }

        .form-title {
            color: #d94769;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .form-description {
            color: #263b59;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .form-control {
            padding: 13px 15px;
            margin-bottom: 14px;
            border: 2px solid #b9dce8;
            border-radius: 15px;
            color: #263b59;
            background-color: #fffdf6;
        }

        .form-control:focus {
            border-color: #5795e5;
            box-shadow: 0 0 0 0.2rem rgba(87, 149, 229, 0.2);
        }

        .enter-btn {
            background-color: #d94769;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 35px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 8px;
            transition: 0.2s;
        }

        .enter-btn:hover {
            background-color: #bd3455;
            color: white;
            transform: translateY(-2px);
        }

        #output {
            margin-top: 22px;
            padding: 12px;
            color: #263b59;
            font-size: 17px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .footer-text {
            color: #5795e5;
            font-size: 13px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 0;
        }

        .decoration {
            font-size: 30px;
            margin-bottom: 10px;
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 25px 20px;
            }

            .school-name {
                font-size: 14px;
            }

            .department {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="main-card">

        <div class="decoration">🍴 🥄 🧁</div>

        <p class="school-name">
            OB MONTESSORI CENTER
        </p>

        <p class="department">
            Junior High School Department
        </p>

        <h1 class="club-title">
            Rainbow<br>
            Catering Club
        </h1>

        <p class="subtitle">
            A passion for food and service!
        </p>

        <hr class="divider">

        <h2 class="form-title">
            Welcome, Future Chef!
        </h2>

        <p class="form-description">
            Enter your name below to get started.
        </p>

        <form onsubmit="return false;">

            <input
                type="text"
                id="firstname"
                class="form-control"
                placeholder="Put your firstname here"
                aria-label="First name"
            >

            <input
                type="text"
                id="lastname"
                class="form-control"
                placeholder="Put your lastname here"
                aria-label="Last name"
            >

            <input
                type="button"
                py-click="checkname"
                class="btn enter-btn"
                value="Let's Get Started!"
            >

            <div id="output"></div>

        </form>

        <hr class="divider">

        <p class="footer-text">
            GOOD FOOD • GOOD SERVICE • GOOD VIBES
        </p>

        <div class="decoration mt-3">🍓 🍪 🍰</div>

    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
